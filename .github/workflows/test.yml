name: Run Tests

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: '1.23'

            - name: Install libvips
              run: sudo apt-get update && sudo apt-get install -y libvips-dev

            - name: Install dependencies
              run: go mod download

            - name: Build
              run: go build -v ./...

            - name: Test
              run: go test -v ./...

    build-and-publish:
        name: call-registry
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: gatuno-manga/workflows/.github/workflows/registry.yml@main
        with:
            image_name: gatuno-file-processor
            build_context: .
            dockerfile_path: Dockerfile.prod
            dockerfile_candidates: Dockerfile,Dockerfile.prod,docker/Dockerfile,build/Dockerfile
            runner_labels_json: '["self-hosted","linux","x64"]'
            build_platform: linux/amd64
        secrets: inherit
