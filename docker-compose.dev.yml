name: gatuno

services:
  file-processor:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    ports:
      - "${GRPC_EXTERNAL_PORT:-50052}:50051"
      - "${HEALTH_EXTERNAL_PORT:-8082}:8081"
    volumes:
      - .:/app
      - gocache:/root/.cache/go-build
      - gomodcache:/go/pkg/mod
    networks:
      - gatuno_gatuno-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - bin
            - tmp
            - .git

volumes:
  gocache:
  gomodcache:

networks:
  gatuno_gatuno-net:
    external: true
